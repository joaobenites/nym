<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1017">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Nym · PET</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body.petmode { margin: 0; }
    .petscreen { max-width: 30rem; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: .7rem;
      padding: max(.8rem, env(safe-area-inset-top)) .9rem max(.8rem, env(safe-area-inset-bottom)); box-sizing: border-box; }
    .petscreen .top { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); }
    .petscreen .top a { color: var(--muted); }
    .petscreen #face { width: min(62vw, 14rem); margin: 0 auto; }
    .petscreen #face svg { width: 100%; height: auto; }
    .petscreen .line { text-align: center; color: var(--muted); font-size: .85rem; min-height: 1.2em; margin: 0; }
    .petscreen #said { background: var(--bg-2); border: 1px solid var(--border, #263041); border-radius: .8rem; padding: .7rem .8rem;
      white-space: pre-wrap; min-height: 3.2rem; flex: 1; overflow-y: auto; }
    .petscreen .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
    .petscreen .chips button { flex: 1 1 auto; padding: .45rem .6rem; font-size: .85rem; }
    .petscreen form { display: flex; gap: .4rem; }
    .petscreen form input { flex: 1; min-width: 0; }
  </style>
</head>
<body class="petmode">
  <main class="petscreen">
    <div class="top"><span id="stage">Nym</span><a href="index.html">Conversa completa</a></div>
    <div id="face" role="img" aria-label="Rosto do Nym"></div>
    <p id="status" class="line"></p>
    <div id="said" aria-live="polite">Conectando...</div>
    <p id="error" class="msgline" role="alert"></p>
    <div class="chips" id="chips"></div>
    <form id="form">
      <input id="text" type="text" placeholder="Fale com o Nym" autocomplete="off" maxlength="4000">
      <button type="submit">Enviar</button>
    </form>
  </main>
  <script src="avatar.js"></script>
  <script src="link.js"></script>
</body>
</html>
